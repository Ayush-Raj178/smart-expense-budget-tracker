apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
  namespace: smart-expense-tracker
data:
  01-create-databases.sql: |
    -- Creates one database per microservice (database-per-service pattern).
    -- Runs once on first MySQL container startup when the data volume is empty.

    CREATE DATABASE IF NOT EXISTS sebt_user_db
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    CREATE DATABASE IF NOT EXISTS sebt_expense_db
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    CREATE DATABASE IF NOT EXISTS sebt_budget_db
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    CREATE DATABASE IF NOT EXISTS sebt_notification_db
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: smart-expense-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: smart-expense-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mysql-root-password
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - 127.0.0.1
            - -uroot
            - -p$(MYSQL_ROOT_PASSWORD)
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - 127.0.0.1
            - -uroot
            - -p$(MYSQL_ROOT_PASSWORD)
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
      - name: mysql-init
        configMap:
          name: mysql-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: smart-expense-tracker
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP
