apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-expense-tracker-ingress
  namespace: smart-expense-tracker
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: smart-expense-tracker.local
    http:
      paths:
      - path: /api/user
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081
      - path: /api/expense
        pathType: Prefix
        backend:
          service:
            name: expense-service
            port:
              number: 8082
      - path: /api/budget
        pathType: Prefix
        backend:
          service:
            name: budget-service
            port:
              number: 8083
      - path: /api/notification
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8084
