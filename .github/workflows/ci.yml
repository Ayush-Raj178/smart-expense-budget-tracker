name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - expense-service
          - budget-service
          - notification-service
    env:
      # These integration tests require real Gmail/SMTP and running-service credentials.
      # Their JUnit conditions only enable them when the corresponding value is "true".
      MAIL_SMOKE_TEST: "false"
      LIVE_ACCOUNT_FLOW_TEST: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      - name: Run ${{ matrix.service }} tests
        working-directory: backend/${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
