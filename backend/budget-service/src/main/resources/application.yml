server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: budget-service
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/sebt_budget_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:budget-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.smartexpense.budgetservice.event
        spring.json.use.type.headers: true
        spring.json.type.mapping: expenseAdded:com.smartexpense.budgetservice.event.ExpenseAddedEvent,expenseUpdated:com.smartexpense.budgetservice.event.ExpenseUpdatedEvent,expenseDeleted:com.smartexpense.budgetservice.event.ExpenseDeletedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: budgetExceeded:com.smartexpense.budgetservice.event.BudgetExceededEvent
    listener:
      ack-mode: record

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  kafka:
    expense-topic: ${KAFKA_EXPENSE_TOPIC:expense-events}
    budget-exceeded-topic: ${KAFKA_BUDGET_EXCEEDED_TOPIC:budget-exceeded}
  budget:
    alert-threshold-percent: ${BUDGET_ALERT_THRESHOLD:80}
  processed-events:
    retention-days: ${PROCESSED_EVENTS_RETENTION_DAYS:7}
    cleanup-cron: ${PROCESSED_EVENTS_CLEANUP_CRON:0 0 2 * * *}
  expense-service:
    base-url: ${EXPENSE_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: ${EXPENSE_SERVICE_CONNECT_TIMEOUT_MS:500}
    read-timeout-ms: ${EXPENSE_SERVICE_READ_TIMEOUT_MS:1000}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    publish-timeout-ms: ${OUTBOX_PUBLISH_TIMEOUT_MS:10000}
    claim-lease-ms: ${OUTBOX_CLAIM_LEASE_MS:30000}
    initial-backoff-ms: ${OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${OUTBOX_MAX_BACKOFF_MS:60000}
